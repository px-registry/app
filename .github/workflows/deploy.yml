name: Deploy to Cloudflare Pages

# Manual deploy ONLY (workflow_dispatch). A push to main does NOT auto-deploy —
# production deploys are an explicit, deliberate action. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN   (Pages:Edit scope)
#   CLOUDFLARE_ACCOUNT_ID
# When run without those secrets, the deploy step fails closed (no deploy).

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=px-app --branch=main
